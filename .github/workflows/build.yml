name: Publish Docker image

on:
  push:
    branches:
      - 'main'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    name: Test Bash scripts

    steps:
      - uses: actions/checkout@v4

      - name: Test Bash scripts
        run: |
          make test-scripts

  test:
    strategy:
      fail-fast: true
      matrix:
        version: [ 16, 17, 18 ]

    runs-on: ubuntu-latest
    name: Test backup and restore with PostgreSQL ${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Test image
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
          VOLUME_PATH: /tmp/postgres
          POSTGRES_DB: foo
          POSTGRES_USER: bar
          POSTGRES_PASSWORD: baz
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm backup /Scripts/backup.sh
          docker compose run --rm backup /Scripts/restore.sh /backup/latest.foo.sql.gz
          docker compose stop

  build:
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        version: [ 16, 17, 18 ]

    runs-on: ubuntu-latest
    name: Build "evoweb/postgres-cron-backup:${{ matrix.version }}" and push it to repository
    needs: [ test-scripts, test ]

    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: evoweb/postgres-cron-backup

      # the following two steps fix ERROR: failed to build: Multi-platform build is not supported for the docker driver.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build \
            --load \
            --no-cache \
            --compress \
            --progress=plain \
            --build-arg POSTGRES_VERSION=${{ matrix.version }} \
            --tag evoweb/postgres-cron-backup:${{ matrix.version }} \
            --platform linux/amd64 \
            .

      - name: Test the build image
        run: |
          docker run --rm evoweb/postgres-cron-backup:${{ matrix.version }} psql --version \
            | grep "(PostgreSQL) ${{ matrix.version }}\."

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref_name != 'main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build multi platform image
        if: github.event_name != 'pull_request' && github.ref_name != 'main'
        run: |
          docker buildx build \
            --push \
            --compress \
            --tag evoweb/postgres-cron-backup:${{ matrix.version }} \
            --tag evoweb/postgres-cron-backup:${{ matrix.version }}.x \
            --tag evoweb/postgres-cron-backup:${{ matrix.version }}.x-${{ github.ref_name }} \
            --build-arg POSTGRES_VERSION=${{ matrix.version }} \
            --platform linux/amd64,linux/arm/v7,linux/arm64 \
            .
