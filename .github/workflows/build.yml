name: Test and publish Docker image

on:
  push:
    branches:
      - 'main'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    name: Test Bash scripts

    steps:
      - uses: actions/checkout@v7

      - name: Test Bash scripts
        run: |
          make test-scripts

  test:
    strategy:
      fail-fast: true
      matrix:
        version: [ 16, 17, 18 ]

    runs-on: ubuntu-latest
    name: Test backup and restore with PostgreSQL ${{ matrix.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Test image
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
          VOLUME_PATH: /tmp/postgres
          POSTGRES_DB: foo
          POSTGRES_USER: bar
          POSTGRES_PASSWORD: baz
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm backup /Scripts/backup.sh
          docker compose run --rm backup /Scripts/restore.sh /backup/latest.foo.sql.gz
          docker compose stop

  build:
    strategy:
      fail-fast: true
      matrix:
        version: [ 16, 17, 18 ]
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

    runs-on: ubuntu-latest
    name: Build "evoweb/postgres-cron-backup:${{ matrix.version }}" for ${{ matrix.platform }}
    needs: [ test-scripts, test ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The cache is scoped to this workflow run, so publish pushes exactly the
      # tested layers while later runs still pick up fresh Alpine packages.
      # It is only written for tags, as publish is the only consumer.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          build-args: POSTGRES_VERSION=${{ matrix.version }}
          tags: evoweb/postgres-cron-backup:${{ matrix.version }}
          cache-to: ${{ startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max,ignore-error=true,scope={0}-{1}-{2}', github.run_id, matrix.version, matrix.platform) || '' }}

      - name: Test the build image
        run: |
          docker run --rm --platform ${{ matrix.platform }} evoweb/postgres-cron-backup:${{ matrix.version }} psql --version \
            | grep "(PostgreSQL) ${{ matrix.version }}\."

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        version: [ 16, 17, 18 ]

    runs-on: ubuntu-latest
    # No matrix expression in the name: a job skipped by its if is never expanded,
    # so GitHub appends the matrix values itself, e.g. "... (16)"
    name: Publish "evoweb/postgres-cron-backup"
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: POSTGRES_VERSION=${{ matrix.version }}
          tags: |
            evoweb/postgres-cron-backup:${{ matrix.version }}
            evoweb/postgres-cron-backup:${{ matrix.version }}.x
            evoweb/postgres-cron-backup:${{ matrix.version }}.x-${{ github.ref_name }}
          cache-from: |
            type=gha,scope=${{ github.run_id }}-${{ matrix.version }}-linux/amd64
            type=gha,scope=${{ github.run_id }}-${{ matrix.version }}-linux/arm64
            type=gha,scope=${{ github.run_id }}-${{ matrix.version }}-linux/arm/v7

  description:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Update Docker Hub description
    needs: publish

    steps:
      - uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: evoweb/postgres-cron-backup
          short-description: Periodic pg_dump backups of PostgreSQL databases, scheduled by cron
          readme-filepath: ./DOCKERHUB.md
